<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Page not found | Mohamed Bar</title>
    <style>
      :root {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #080b12;
        color: #f5f7fb;
        padding: 24px;
      }
      .card {
        width: min(620px, 100%);
        padding: 40px;
        border: 1px solid #273041;
        border-radius: 24px;
        background: #0d121d;
        text-align: center;
      }
      h1 {
        font-size: clamp(3rem, 14vw, 7rem);
        margin: 0;
        line-height: 0.9;
      }
      h2 {
        margin: 22px 0 10px;
      }
      p {
        color: #aab4c5;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 13px 20px;
        border-radius: 999px;
        background: #f5f7fb;
        color: #080b12;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>404</h1>
      <h2>This page does not exist.</h2>
      <p>
        The portfolio itself is available from the repository root. Use the
        button below to go back safely.
      </p>
      <a href="./">Back to portfolio</a>
    </main>
  </body>
</html>
